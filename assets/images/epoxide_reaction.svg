<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 150">
  <!-- Left side reactant (Epoxide compound) -->
  <text x="30" y="80" font-family="Arial" font-size="18">羧基与-NCO，R-CH-CH₂</text>

  <!-- Oxygen connection to both carbons -->
  <line x1="175" y1="85" x2="190" y2="105" stroke="black" stroke-width="1.5"/>
  <line x1="210" y1="85" x2="195" y2="105" stroke="black" stroke-width="1.5"/>
  <text x="185" y="120" font-family="Arial" font-size="18">O</text>
  
  <!-- Right side reactant (Alcohol) -->
  <text x="230" y="100" font-family="Arial" font-size="18">， R-CH₂-OH</text>
  
  <!-- Reaction text -->
  <text x="340" y="100" font-family="Arial" font-size="18">反应</text>
</svg>