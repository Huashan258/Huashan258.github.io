  <!-- Red oval highlight -->
  <ellipse cx="190" cy="200" rx="25" ry="150" fill="none" stroke="red" stroke-width="2" />
  <!-- Caption -->
  <text x="250" y="515" font-family="SimSun, Arial" font-size="14" text-anchor="middle">环氧树脂加入固化剂后的时间与拉伸胶接强度的关系</text>
</svg>
