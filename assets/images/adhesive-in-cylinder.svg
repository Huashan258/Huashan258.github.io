  <!-- γLV symbol -->
  <text x="230" y="210" font-family="serif" font-size="18" font-style="italic">γLV</text>
  
  <!-- Angle symbol -->
  <text x="145" y="205" font-family="serif" font-size="18" font-style="italic">θ</text>
  <path d="M145,190 L160,190 A15,15 0 0,0 155,177" fill="none" stroke="black" stroke-width="1"/>
  
  <!-- d dimension arrow -->
  <line x1="100" y1="80" x2="300" y2="80" stroke="black" stroke-width="1.5"/>
  <polygon points="100,80 110,75 110,85" fill="black"/>
  <polygon points="300,80 290,75 290,85" fill="black"/>
  <text x="200" y="70" font-family="serif" font-size="18" font-style="italic">d</text>
  
  <!-- Caption -->
  <text x="200" y="450" font-family="SimSun, Arial" font-size="18" text-anchor="middle">浸入圆筒的胶黏剂</text>
