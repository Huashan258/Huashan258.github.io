---
layout: page
title: 文章分类
permalink: /categories/
---

<div class="categories">
{% assign sorted_categories = site.categories | sort %}
{% for category in sorted_categories %}
  <h2>{{ category[0] }}</h2>
  <ul>
    {% for post in category[1] %}
      <li>
        <a href="{{ post.url }}">{{ post.title }}</a>
      </li>
    {% endfor %}
  </ul>
{% endfor %}
</div>
