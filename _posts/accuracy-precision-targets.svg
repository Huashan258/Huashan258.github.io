<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
  <!-- 背景 -->
  <rect width="900" height="300" fill="white" />
  
  <!-- 第一个靶心：高精密度，低正确度 -->
  <g transform="translate(150, 150)">
    <!-- 靶心圆环 -->
    <circle cx="0" cy="0" r="100" fill="white" stroke="black" stroke-width="2" />
    <circle cx="0" cy="0" r="80" fill="white" stroke="black" stroke-width="1" />
    <circle cx="0" cy="0" r="60" fill="white" stroke="black" stroke-width="1" />
    <circle cx="0" cy="0" r="40" fill="white" stroke="black" stroke-width="1" />
    <circle cx="0" cy="0" r="20" fill="red" stroke="black" stroke-width="1" />
    
    <!-- 射击点: 高精密度(集中)，低正确度(偏离靶心) -->
    <circle cx="50" cy="50" r="3" fill="blue" />
    <circle cx="55" cy="53" r="3" fill="blue" />
    <circle cx="52" cy="48" r="3" fill="blue" />
    <circle cx="57" cy="51" r="3" fill="blue" />
    <circle cx="53" cy="55" r="3" fill="blue" />
    <circle cx="56" cy="49" r="3" fill="blue" />
    <circle cx="51" cy="52" r="3" fill="blue" />
    <circle cx="54" cy="47" r="3" fill="blue" />
    
    <!-- 标签 -->
    <text x="0" y="130" text-anchor="middle" font-family="Arial" font-size="14" fill="black">高精密度，低正确度</text>
  </g>
  
  <!-- 第二个靶心：低精密度，高正确度 -->
  <g transform="translate(450, 150)">
    <!-- 靶心圆环 -->
    <circle cx="0" cy="0" r="100" fill="white" stroke="black" stroke-width="2" />
    <circle cx="0" cy="0" r="80" fill="white" stroke="black" stroke-width="1" />
    <circle cx="0" cy="0" r="60" fill="white" stroke="black" stroke-width="1" />
    <circle cx="0" cy="0" r="40" fill="white" stroke="black" stroke-width="1" />
    <circle cx="0" cy="0" r="20" fill="red" stroke="black" stroke-width="1" />
    
    <!-- 射击点: 低精密度(分散)，高正确度(围绕靶心) -->
    <circle cx="10" cy="30" r="3" fill="blue" />
    <circle cx="-15" cy="-20" r="3" fill="blue" />
    <circle cx="40" cy="-5" r="3" fill="blue" />
    <circle cx="-35" cy="10" r="3" fill="blue" />
    <circle cx="-5" cy="-45" r="3" fill="blue" />
    <circle cx="25" cy="20" r="3" fill="blue" />
    <circle cx="-30" cy="-25" r="3" fill="blue" />
    <circle cx="5" cy="35" r="3" fill="blue" />
    
    <!-- 标签 -->
    <text x="0" y="130" text-anchor="middle" font-family="Arial" font-size="14" fill="black">低精密度，高正确度</text>
  </g>
  
  <!-- 第三个靶心：高精密度，高正确度 -->
  <g transform="translate(750, 150)">
    <!-- 靶心圆环 -->
    <circle cx="0" cy="0" r="100" fill="white" stroke="black" stroke-width="2" />
    <circle cx="0" cy="0" r="80" fill="white" stroke="black" stroke-width="1" />
    <circle cx="0" cy="0" r="60" fill="white" stroke="black" stroke-width="1" />
    <circle cx="0" cy="0" r="40" fill="white" stroke="black" stroke-width="1" />
    <circle cx="0" cy="0" r="20" fill="red" stroke="black" stroke-width="1" />
    
    <!-- 射击点: 高精密度(集中)，高正确度(靶心附近) -->
    <circle cx="5" cy="3" r="3" fill="blue" />
    <circle cx="-2" cy="4" r="3" fill="blue" />
    <circle cx="3" cy="-5" r="3" fill="blue" />
    <circle cx="-4" cy="-3" r="3" fill="blue" />
    <circle cx="6" cy="2" r="3" fill="blue" />
    <circle cx="-5" cy="5" r="3" fill="blue" />
    <circle cx="2" cy="-4" r="3" fill="blue" />
    <circle cx="-3" cy="-6" r="3" fill="blue" />
    
    <!-- 标签 -->
    <text x="0" y="130" text-anchor="middle" font-family="Arial" font-size="14" fill="black">高精密度，高正确度</text>
  </g>
</svg>
