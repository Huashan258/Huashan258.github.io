---
layout: default
---

<div class="home">
  {{ content }}

  <h2>最新文章</h2>
  <ul class="post-list">
    {% for post in site.posts %}
      <li>
        <h3>
          <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
        </h3>
        <p>{{ post.date | date: "%Y-%m-%d" }}</p>
      </li>
    {% endfor %}
  </ul>
</div>
